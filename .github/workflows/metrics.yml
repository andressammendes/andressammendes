name: Generate Activity Graph

on:
  schedule:
    - cron: "0 0 * * *"
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-activity-graph
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
      - uses: ashutosh00710/github-readme-activity-graph@master
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          output_filepath: github-readme-activity-graph.svg
          theme: react-dark
          bg_color: 0d1117
          hide_border: true
          area: false
          line: 6f42c1
          point: ffffff
